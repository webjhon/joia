<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JOIA • Terminal Educacional</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --bg:#0b0f12;
  --glass:#0e151b99;
  --glass-strong:#0e151bcc;
  --border:#2ee59d33;
  --accent:#6ee7b7;
  --txt:#d9f5e8;
  --shadow:0 8px 28px #00000066;
  --radius:14px;
}

body {
  background: var(--bg);
  color: var(--txt);
  height: 100vh;
  margin: 0;
  font-family: "JetBrains Mono", monospace;
  overflow: hidden;
}

.app {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: 80px 1fr;
  height: 100%;
  gap: 18px;
  padding: 20px;
  min-height: 0;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  box-sizing: border-box;
  backdrop-filter: blur(10px);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px;
  gap: 12px;
  min-height: 0;
  height: 100%;
}

.brand {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg,#12382a,#0d231a);
  border: 1px solid #2ee59d55;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: inset 0 0 8px #2ee59d22, 0 4px 10px #00000055;
}

.side-btn {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--txt);
  border: 1px solid #2ee59d26;
  background: #0f171db3;
  transition: all .2s ease;
}
.side-btn:hover {
  transform: translateY(-2px);
  border-color:#2ee59d66;
  color:var(--accent);
  box-shadow: 0 6px 12px #00000055, inset 0 0 12px #2ee59d1a;
  cursor:pointer;
}
.side-btn.active { color:var(--accent); border-color:#2ee59d88; background:#153126; }
.side-spacer{ flex:1 }

.notes-panel { position:fixed; inset:20px 20px 20px 118px; z-index:10; display:none; grid-template-rows:auto 1fr auto; padding:20px; background:#0b1217f5; border:1px solid #2ee59d55; border-radius:var(--radius); box-shadow:var(--shadow); }
.notes-panel.open { display:grid; }
.notes-header,.notes-actions { display:flex; align-items:center; gap:10px; }
.notes-header { justify-content:space-between; margin-bottom:14px; }
#notesInput { width:100%; resize:none; padding:16px; color:var(--txt); background:#081015; border:1px solid var(--border); border-radius:10px; outline:none; line-height:1.6; }
.action-btn { border:1px solid #2ee59d44; border-radius:8px; padding:8px 12px; background:#102019; color:var(--txt); font:inherit; font-size:12px; cursor:pointer; }
.action-btn:hover { color:var(--accent); border-color:#2ee59d88; }
.notes-actions { justify-content:space-between; margin-top:12px; }
.save-status { color:#7aa998; font-size:11px; }

/* Terminal */
.terminal {
  box-sizing: border-box;
  display: grid;
  grid-template-rows: auto 1fr auto;
  backdrop-filter: blur(16px);
  background: var(--glass-strong);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.terminal-header {
  padding: 14px 22px;
  background: linear-gradient(180deg, #0f171db3, #0d1419a8);
  border-bottom: 1px solid #2ee59d22;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}

.output {
  min-height: 0;
  padding: 30px clamp(18px, 4vw, 64px) 38px;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-gutter: stable;
}

.output .msg {
  width: fit-content;
  max-width: min(76%, 820px);
  padding: 15px 18px;
  margin: 0 0 22px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: clamp(13.5px, .35vw + 12px, 15px);
  line-height: 1.65;
  letter-spacing: .005em;
  overflow-wrap: anywhere;
  box-shadow: none;
}
.msg.user {
  margin-left: auto;
  background: #172028;
  border-color: #293640;
  border-right: 2px solid #527b98;
  color: #d1dce4;
  text-align: left;
}
.msg.joia {
  margin-right: auto;
  padding-left: 17px;
  background: transparent;
  border-color: transparent;
  border-left: 2px solid #4f8b75;
  color: #d5dfdb;
}
.output .msg > b:first-child {
  display: block;
  margin-bottom: 7px;
  color: #82b9a5;
  font-size: .82em;
  line-height: 1.25;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.output .msg.user > b:first-child {
  color: #8eafc5;
  text-align: right;
}
.output .msg.thinking > b:first-child {
  display: inline;
  margin: 0;
}
@media (max-width: 700px) {
  .output { padding: 20px 12px 26px; }
  .output .msg {
    max-width: 95%;
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 13.5px;
    line-height: 1.6;
  }
}
.welcome { max-width:760px; margin:6vh auto 0; text-align:center; }
.welcome-mark { font-size:42px; margin-bottom:8px; }
.welcome h1 { color:#8cf0d3; font-size:24px; margin:0 0 10px; }
.welcome p { color:#9ab9ad; line-height:1.65; }
.icebreakers { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:20px; }
.icebreaker { border:1px solid #2ee59d38; border-radius:999px; padding:9px 13px; background:#0b1217; color:#b8d8cc; font:inherit; font-size:11px; cursor:pointer; }
.icebreaker:hover { border-color:#2ee59d88; color:var(--accent); transform:translateY(-1px); }
.thinking { display:flex; align-items:center; gap:10px; color:#9ab9ad; }
.thinking-dots span { display:inline-block; width:5px; height:5px; margin:0 2px; border-radius:50%; background:var(--accent); animation:thinking 1s infinite ease-in-out; }
.thinking-dots span:nth-child(2) { animation-delay:.15s; }
.thinking-dots span:nth-child(3) { animation-delay:.3s; }
@keyframes thinking { 0%,80%,100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-3px); } }

.terminal-footer {
  padding: 12px 16px;
  border-top: 1px solid #2ee59d22;
  background: #0e151bb3;
}

.input-wrap {
  display: flex;
  align-items: center;
  background: #0b1217;
  border: 1px solid #2ee59d30;
  border-radius: 12px;
  padding: 8px 12px;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.input-wrap:focus-within {
  border-color:#2ee59d70;
  box-shadow: 0 0 0 4px #2ee59d14;
}
.prompt {
  color: var(--accent);
  margin-right: 10px;
}
#userInput {
  flex: 1;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--txt);
  font-size: 13px;
}
#userInput::placeholder { color: #7aa998; }

.output::-webkit-scrollbar { width: 10px; }
.output::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg,#1a3a2f,#24543f);
  border-radius: 8px;
}
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">J🜲</div>
    <button class="side-btn" id="openNotes" title="Caderno de anotações" aria-label="Abrir caderno">📝</button>
    <button class="side-btn" id="copyLast" title="Anotar última resposta" aria-label="Anotar última resposta">✚</button>
    <button class="side-btn" id="downloadNotes" title="Baixar anotações" aria-label="Baixar anotações">⇩</button>
    <button class="side-btn" id="newConversation" title="Nova conversa" aria-label="Nova conversa">↻</button>
    <div class="side-spacer"></div>
    <button class="side-btn" id="clearNotes" title="Limpar anotações" aria-label="Limpar anotações">⌫</button>
  </aside>

  <main class="terminal">
    <header class="terminal-header">
      <div><b>💎 JOIA • Terminal Educacional</b></div>
      <div style="color:#8cf0d3;">O QUE DESEJA APRENDER</div>
    </header>

    <section id="output" class="output">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">💎</div><h1>JOIA</h1>
        <p>Sua parceira para aprender tecnologia com perguntas, pistas e descobertas.<br>Comece do seu jeito — nenhuma pergunta foi escolhida por você.</p>
        <div class="icebreakers" aria-label="Sugestões para começar">
          <button class="icebreaker">Quero entender um conceito</button><button class="icebreaker">Estou travado em um exercício</button>
          <button class="icebreaker">Quero organizar meus estudos</button><button class="icebreaker">Pode me fazer um desafio?</button>
        </div>
      </div>
    </section>

    <footer class="terminal-footer">
      <div class="input-wrap">
        <span class="prompt">>_</span>
        <input id="userInput" type="text" placeholder="Digite aqui e pressione Enter..." autocomplete="off" />
      </div>
    </footer>
  </main>
</div>

<section class="notes-panel" id="notesPanel" aria-label="Caderno de anotações">
  <div class="notes-header"><b>📝 Meu caderno JOIA</b><button class="action-btn" id="closeNotes">Fechar</button></div>
  <textarea id="notesInput" placeholder="Registre conceitos, dúvidas, exemplos e próximos passos..."></textarea>
  <div class="notes-actions"><span class="save-status" id="saveStatus">Salvo automaticamente neste dispositivo</span><button class="action-btn" id="saveNotes">Salvar agora</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script>
lucide.createIcons();

const apiUrl = "teste_openai.php";
const output = document.getElementById("output");
const userInput = document.getElementById("userInput");
const conversationId = sessionStorage.getItem("joia_conversation_id") || crypto.randomUUID();
sessionStorage.setItem("joia_conversation_id", conversationId);
const notesPanel = document.getElementById("notesPanel");
const notesInput = document.getElementById("notesInput");
const saveStatus = document.getElementById("saveStatus");
let lastJoiaAnswer = "";
notesInput.value = localStorage.getItem("joia_notes") || "";

function renderMessage(text, sender){
  document.getElementById("welcome")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + sender;
  const label = document.createElement("b");
  label.textContent = sender === "user" ? "Você: " : "JOIA: ";
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  div.style.whiteSpace = "pre-wrap";
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function showThinking(){
  const div = document.createElement("div");
  div.className = "msg joia thinking";
  div.id = "thinking";
  div.innerHTML = '<b>JOIA:</b> Pensando igual Profe João <span class="thinking-dots"><span></span><span></span><span></span></span>';
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

async function renderTypedMessage(text, downloadUrl = ""){
  document.getElementById("thinking")?.remove();
  const div = document.createElement("div");
  div.className = "msg joia";
  div.style.whiteSpace = "pre-wrap";
  const label = document.createElement("b");
  label.textContent = "JOIA: ";
  const content = document.createTextNode("");
  div.append(label, content);
  output.appendChild(div);
  const step = Math.max(1, Math.ceil(text.length / 80));
  for(let i = 0; i < text.length; i += step){
    content.nodeValue += text.slice(i, i + step);
    output.scrollTop = output.scrollHeight;
    await new Promise(resolve => setTimeout(resolve, 12));
  }
  lastJoiaAnswer = text;
  if(downloadUrl){
    const link = document.createElement("a");
    link.className = "action-btn";
    link.href = downloadUrl;
    link.textContent = "⬇ Baixar relatório em PDF";
    link.style.display = "inline-block";
    link.style.marginTop = "12px";
    div.appendChild(document.createElement("br"));
    div.appendChild(link);
  }
}

async function sendMsg(){
  const msg = userInput.value.trim();
  if(!msg) return;
  renderMessage(msg, "user");
  userInput.value = "";
  userInput.disabled = true;
  showThinking();
  try {
    const res = await fetch(apiUrl,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({mensagem:msg, conversation_id:conversationId})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.erro || "Não foi possível conversar com a JOIA.");
    await renderTypedMessage(data.resposta, data.download || "");
  } catch (error) {
    document.getElementById("thinking")?.remove();
    await renderTypedMessage(`⚠️ ${error.message}`);
  } finally {
    userInput.disabled = false;
    userInput.focus();
  }
}

function saveNotes(){
  localStorage.setItem("joia_notes", notesInput.value);
  saveStatus.textContent = "Anotações salvas agora ✓";
  setTimeout(() => saveStatus.textContent = "Salvo automaticamente neste dispositivo", 1800);
}

document.getElementById("openNotes").addEventListener("click", () => { notesPanel.classList.add("open"); notesInput.focus(); });
document.getElementById("closeNotes").addEventListener("click", () => notesPanel.classList.remove("open"));
document.getElementById("saveNotes").addEventListener("click", saveNotes);
notesInput.addEventListener("input", saveNotes);
document.getElementById("copyLast").addEventListener("click", () => {
  if(!lastJoiaAnswer) return alert("Converse com a JOIA antes de anotar uma resposta.");
  notesInput.value += `${notesInput.value ? "\n\n" : ""}💎 Resposta da JOIA\n${lastJoiaAnswer}`;
  saveNotes(); notesPanel.classList.add("open");
});
document.getElementById("downloadNotes").addEventListener("click", () => {
  if(!notesInput.value.trim()) return alert("Seu caderno ainda está vazio.");
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([notesInput.value], {type:"text/plain;charset=utf-8"}));
  link.download = "anotacoes-joia.txt"; link.click(); URL.revokeObjectURL(link.href);
});
document.getElementById("clearNotes").addEventListener("click", () => {
  if(confirm("Deseja apagar todas as anotações deste dispositivo?")){ notesInput.value = ""; saveNotes(); }
});
document.getElementById("newConversation").addEventListener("click", () => {
  if(confirm("Iniciar uma nova conversa e um novo cadastro?")){
    fetch(apiUrl, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({acao:"reset", conversation_id:conversationId})})
      .finally(() => { sessionStorage.removeItem("joia_conversation_id"); location.reload(); });
  }
});
document.querySelectorAll(".icebreaker").forEach(button => button.addEventListener("click", () => {
  userInput.value = button.textContent; userInput.focus();
}));

userInput.addEventListener("keydown", e=>{
  if(e.key==="Enter") sendMsg();
});
</script>
</body>
</html>
